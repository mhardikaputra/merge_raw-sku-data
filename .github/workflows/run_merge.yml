name: Merge Google Sheets

on:
  # Allows you to click a button in GitHub to run it manually
  workflow_dispatch: 
  # Runs automatically every day at 12:00 AM UTC
  schedule:
    - cron: '0 1-12 * * 1-5'
jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run merge script
      env:
        # This passes the secret to the Python script
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }} 
      run: python merge_sheets.py
